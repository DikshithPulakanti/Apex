name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (mocked, no live infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      - name: Run unit tests
        run: >
          pytest -m "not integration"
          --cov=agents --cov=database --cov=events --cov=pipeline --cov=training --cov=mcp_servers
          --cov-report=term-missing

  integration:
    name: Integration tests (live docker-compose stack)
    runs-on: ubuntu-latest
    # Manual trigger, or automatically on pushes to main — never on every PR,
    # since this brings up real Neo4j/Weaviate/Redis containers and hits arXiv.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download spaCy model
        run: python -m spacy download en_core_web_lg

      - name: Start infrastructure
        run: docker compose up -d neo4j redis weaviate

      - name: Wait for infrastructure to be healthy
        run: |
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until docker compose exec -T neo4j cypher-shell -u neo4j -p apexpassword "RETURN 1" >/dev/null 2>&1; do sleep 3; done'
          echo "Waiting for Weaviate..."
          timeout 60 bash -c 'until curl -sf http://localhost:8080/v1/.well-known/ready >/dev/null 2>&1; do sleep 3; done'
          echo "Waiting for Redis..."
          timeout 30 bash -c 'until docker compose exec -T redis redis-cli ping >/dev/null 2>&1; do sleep 2; done'

      - name: Run integration tests
        run: pytest -m integration

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v
